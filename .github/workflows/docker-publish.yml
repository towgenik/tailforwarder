name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # to push the image to GitHub Container Registry

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set image name
      # GHCR image names must be lowercase.
      run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tailforwarder" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
        tags: |
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ github.sha }}
        # The source label links the package to this repository on GHCR, so the
        # package page shows the README and inherits the repository's access.
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.title=tailforwarder
          org.opencontainers.image.description=Forward traffic between a LAN and a Tailscale network using macvlan and iptables
          org.opencontainers.image.licenses=Apache-2.0
        annotations: |
          index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          index:org.opencontainers.image.description=Forward traffic between a LAN and a Tailscale network using macvlan and iptables
          index:org.opencontainers.image.licenses=Apache-2.0
